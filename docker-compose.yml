services:
  db:
    image: postgres:17
    container_name: tripwise-db
    environment:
      POSTGRES_USER: tripwise
      POSTGRES_PASSWORD: tripwise
      POSTGRES_DB: tripwise
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripwise"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata: