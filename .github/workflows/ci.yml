name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx vitest run

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test backend/TripWise.UnitTests

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test backend/TripWise.IntegrationTests

  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: [frontend, unit-tests, integration-tests]
    services:
      db:
        image: postgres:17
        env:
          POSTGRES_USER: tripwise
          POSTGRES_PASSWORD: tripwise
          POSTGRES_DB: tripwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tripwise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply database migrations
        run: |
          dotnet tool restore
          dotnet build backend/TripWise.Api
          dotnet ef database update --project backend/TripWise.Infrastructure --startup-project backend/TripWise.Api --no-build

      - name: Build E2E tests and install Playwright browser
        run: |
          dotnet build backend/TripWise.E2ETests
          pwsh backend/TripWise.E2ETests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start API
        env:
          ExchangeRates__Provider: Fake
          GooglePlaces__Provider: Fake
          Gemini__Provider: Fake
        run: |
          dotnet run --project backend/TripWise.Api --launch-profile http > api.log 2>&1 &

      - name: Start frontend
        working-directory: frontend
        run: |
          npm ci
          npm run dev -- --port 5173 --strictPort > ../web.log 2>&1 &

      - name: Wait for API and frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null && curl -sf http://localhost:5173/api/trips > /dev/null; then
              echo "ready"
              exit 0
            fi
            sleep 2
          done
          echo "servers did not start in time"
          exit 1

      - name: Run E2E tests
        run: dotnet test backend/TripWise.E2ETests --no-build

      - name: Show server logs
        if: failure()
        run: |
          echo "::group::api.log"
          cat api.log || true
          echo "::endgroup::"
          echo "::group::web.log"
          cat web.log || true
          echo "::endgroup::"
